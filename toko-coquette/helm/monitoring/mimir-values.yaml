
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    multitenancy_enabled: true

    server:
      http_listen_port: 9009
      log_level: warn

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb

    distributor:
      ring:
        kvstore:
          store: inmemory

    ingester:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: inmemory

    store_gateway:
      sharding_ring:
        kvstore:
          store: inmemory
        replication_factor: 1

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir-monolithic
  namespace: monitoring
spec:
  serviceName: mimir-monolithic
  replicas: 1
  selector:
    matchLabels:
      app: mimir-monolithic
  template:
    metadata:
      labels:
        app: mimir-monolithic
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: mimir
          image: grafana/mimir:3.2.3
          args:
            - "-target=all"
            - "-config.file=/etc/mimir/mimir.yaml"
          ports:
            - name: http
              containerPort: 9009
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mimir-monolithic
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: mimir-monolithic
  ports:
    - name: http
      port: 9009
      targetPort: 9009
      protocol: TCP
