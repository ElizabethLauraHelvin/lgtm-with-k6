
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    multitenancy_enabled: true

    server:
      http_listen_port: 9009
      log_level: info

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: inmemory

    distributor:
      ring:
        kvstore:
          store: inmemory

    ingester:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1

    store_gateway:
      sharding_ring:
        kvstore:
          store: inmemory
        replication_factor: 1

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler

    alertmanager:
      data_dir: /data/alertmanager

    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/alertmanager-storage

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir-monolithic
  namespace: monitoring
spec:
  serviceName: mimir-monolithic
  replicas: 1
  selector:
    matchLabels:
      app: mimir-monolithic
  template:
    metadata:
      labels:
        app: mimir-monolithic
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:latest
          args:
            - "-target=all"
            - "-config.file=/etc/mimir/mimir.yaml"
          ports:
            - name: http
              containerPort: 9009
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data

---
apiVersion: v1
kind: Service
metadata:
  name: mimir-monolithic
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: mimir-monolithic
  ports:
    - name: http
      port: 9009
      targetPort: 9009
      protocol: TCP
