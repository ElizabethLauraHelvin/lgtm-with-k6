grafana:
  adminUser: admin
  adminPassword: admin123

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  
  deploymentStrategy:
    type: Recreate

  service:
    type: ClusterIP

  env:
    GF_SMTP_PASSWORD: "$__file{/etc/secrets/grafana-smtp/password}"

  extraSecretMounts:
    - name: grafana-smtp
      secretName: grafana-smtp
      mountPath: /etc/secrets/grafana-smtp
      readOnly: true


  grafana.ini:
    smtp:
      enabled: true
      host: smtp.gmail.com:587
      user: elizabethlauraa465@gmail.com
      from_address: elizabethlauraa465@gmail.com
      from_name: Alert-LGTM

    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true

    azure:
      managed_identity_enabled: true

  sidecar:
    dashboards:
      enabled: false

    datasources:
      enabled: false

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: true


    - name: Mimir-Pods
      type: prometheus
      uid: mimir-pods
      access: proxy
      url: http://mimir-gateway.monitoring.svc.cluster.local/prometheus
      jsonData:
        httpMethod: POST
        prometheusType: Mimir
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: pods

    - name: Mimir-Nodes
      type: prometheus
      access: proxy
      url: http://mimir-gateway.monitoring.svc.cluster.local/prometheus
      jsonData:
        httpMethod: POST
        prometheusType: Mimir
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: nodes
    

    # ==========================================
    # Tempo
    # ==========================================
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo-query-frontend.monitoring.svc.cluster.local:3200
      isDefault: false
      editable: true

      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          filterByTraceID: true
          filterBySpanID: true

        tracesToMetrics:
          datasourceUid: mimir-pods
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"

        serviceMap:
          datasourceUid: mimir-pods

        nodeGraph:
          enabled: true
      
    - name: Pyroscope
      type: grafana-pyroscope-datasource
      uid: pyroscope
      access: proxy
      url: http://pyroscope-query-frontend.monitoring.svc.cluster.local:4040
      isDefault: false
      editable: true

# ==================================================
# Alertmanager
# ==================================================
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1


# ==================================================
# Prometheus Operator
# ==================================================
prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi


# ==================================================
# Kube State Metrics
# ==================================================
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi


# ==================================================
# Disable Control Plane ServiceMonitors
# ==================================================
kubelet:
  enabled: false

kubeApiServer:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

coreDns:
  enabled: false


# ==================================================
# Prometheus Server
# ==================================================
prometheus:
  enabled: false
