
deploymentMode: SingleBinary

global: {}

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

canary:
  enabled: false

# SingleBinary: seluruh proses Loki berjalan dalam satu Pod.
singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Matikan komponen Microservices.
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

# Cache tidak diperlukan untuk deployment kecil.
chunksCache:
  enabled: false

resultsCache:
  enabled: false

gateway:
  enabled: true

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  limits_config:
    retention_period: 1h
    max_query_lookback: 1h
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20

  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 5m
    retention_enabled: true
    retention_delete_delay: 2m
    delete_request_store: filesystem

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

