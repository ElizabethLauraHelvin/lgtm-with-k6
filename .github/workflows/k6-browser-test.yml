
name: K6 Browser Testing

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: "Pilih skenario browser yang ingin dijalankan"
        required: true
        type: choice
        options:
          - capacity
          - homepage
          - product
          - login
          - cart
          - checkout
          - journey
          - individual-api-capacity
        default: capacity
      target_url:
        description: "Base URL frontend Toko Coquette"
        required: true
        type: string
        default: "http://127.0.0.1:8080"
      test_api:
        description: "Endpoint yang diuji untuk individual API capacity"
        required: true
        type: choice
        options:
          - all
          - login
          - products
          - me
          - orders
        default: all
      api_max_vus:
        description: "Maximum VUs untuk individual API capacity"
        required: true
        type: number
        default: 20
      api_vus_step:
        description: "Kenaikan VU setiap tahap"
        required: true
        type: number
        default: 5
      api_stage_duration:
        description: "Durasi setiap tahap, contoh 30s"
        required: true
        type: string
        default: "30s"
      include_order_write:
        description: "Aktifkan POST /api/orders (membuat order sungguhan)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: k6-browser-testing
  cancel-in-progress: false

jobs:
  browser-test:
    name: Run ${{ inputs.test_type }} browser test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90

    env:
      TARGET_URL: ${{ inputs.target_url }}
      TEST_TYPE: ${{ inputs.test_type }}
      MAX_VUS: "50"
      VUS_STEP: "2"
      CAPACITY_VUS_STEP: "5"
      MIN_AVAILABLE_RAM_MB: "2048"
      STAGE_DURATION: "30s"
      FAILURE_RATE_LIMIT: "0.10"
      RECOVERY_TIMEOUT_MINUTES: "10"
      TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}
      TEST_API: ${{ inputs.test_api }}
      API_MAX_VUS: ${{ inputs.api_max_vus }}
      API_VUS_STEP: ${{ inputs.api_vus_step }}
      API_STAGE_DURATION: ${{ inputs.api_stage_duration }}
      INCLUDE_ORDER_WRITE: ${{ inputs.include_order_write }}
      MAX_P95_MS: "500"
      MAX_ERROR_RATE: "0.01"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup k6 with browser support
        uses: grafana/setup-k6-action@v1
        with:
          browser: true

      - name: Validate runner and application
        shell: bash
        run: |
          set -euo pipefail
          command -v k6
          command -v curl
          command -v node
          command -v python3
          if [ "$TEST_TYPE" = "capacity" ]; then command -v setsid; fi
          k6 version

          test -f "k6-script-test/browser/config.js"
          test -f "k6-script-test/browser/journey.js"
          if [ "$TEST_TYPE" = "capacity" ]; then test -f "k6-script-test/browser/capacity-automated-test.js"; fi
          if [ "$TEST_TYPE" = "individual-api-capacity" ]; then test -f "k6-script-test/api/api-capacity-test.js"; fi
          test -f "convert_k6_json_to_jtl.py"

          curl -fsS --max-time 15 "$TARGET_URL" -o /dev/null

          if [ "$TEST_TYPE" = "individual-api-capacity" ]; then
            test -f "generate-k6-capacity-report.py"
            test -f "convert-k6-capacity-to-jtl.py"
            [[ "$API_MAX_VUS" =~ ^[0-9]+$ ]] && [ "$API_MAX_VUS" -ge 1 ] && [ "$API_MAX_VUS" -le 100 ]
            [[ "$API_VUS_STEP" =~ ^[0-9]+$ ]] && [ "$API_VUS_STEP" -ge 1 ] && [ "$API_VUS_STEP" -le "$API_MAX_VUS" ]
          fi

          case "$TEST_TYPE" in
            capacity|login|cart|checkout|journey|individual-api-capacity)
              if [ -z "$TEST_EMAIL" ] || [ -z "$TEST_PASSWORD" ]; then
                echo "::error::Skenario $TEST_TYPE memerlukan repository secrets K6_TEST_EMAIL dan K6_TEST_PASSWORD."
                exit 1
              fi
              ;;
            homepage|product) ;;
            *)
              echo "::error::Skenario tidak dikenal: $TEST_TYPE"
              exit 1
              ;;
          esac

      - name: Select script and prepare results
        id: select
        shell: bash
        run: |
          set -euo pipefail

          case "$TEST_TYPE" in
            capacity) SCRIPT="k6-script-test/browser/capacity-automated-test.js" ;;
            homepage) SCRIPT="k6-script-test/browser/homepage-test.js" ;;
            product) SCRIPT="k6-script-test/browser/product-test.js" ;;
            login) SCRIPT="k6-script-test/browser/login-test.js" ;;
            cart) SCRIPT="k6-script-test/browser/cart-test.js" ;;
            checkout) SCRIPT="k6-script-test/browser/checkout-test.js" ;;
            journey) SCRIPT="k6-script-test/browser/journey-test.js" ;;
            individual-api-capacity) SCRIPT="k6-script-test/api/api-capacity-test.js" ;;
          esac

          test -f "$SCRIPT"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

          mkdir -p k6-browser-results

      - name: Start Mimir port-forward when available
        id: mimir
        shell: bash
        run: |
          set -euo pipefail

          if command -v kubectl >/dev/null 2>&1 && \
             kubectl get svc mimir-monolithic -n monitoring >/dev/null 2>&1; then

            kubectl -n monitoring port-forward svc/mimir-monolithic 19009:9009 \
              > k6-browser-results/mimir-port-forward.log 2>&1 &

            echo $! > k6-browser-results/mimir-port-forward.pid

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:19009/ready >/dev/null 2>&1; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 2
            done

            echo "Mimir not ready; continuing without remote write."
          else
            echo "kubectl/Mimir unavailable; continuing without remote write."
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Run selected browser scenario
        id: k6
        shell: bash
        env:
          SCRIPT: ${{ steps.select.outputs.script }}
          MIMIR_ENABLED: ${{ steps.mimir.outputs.enabled }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -uo pipefail

          STARTED_AT="$(date --iso-8601=seconds)"
          STARTED_MS="$(date +%s%3N)"

          export K6_BROWSER_HEADLESS=true
          export BASE_URL="$TARGET_URL"
          export MAX_VUS VUS_STEP CAPACITY_VUS_STEP STAGE_DURATION FAILURE_RATE_LIMIT TEST_EMAIL TEST_PASSWORD
          export TEST_API INCLUDE_ORDER_WRITE MAX_P95_MS MAX_ERROR_RATE

          K6_ARGS=()
          RAM_ABORT=false
          if [ "$MIMIR_ENABLED" = "true" ]; then
            export K6_PROMETHEUS_RW_SERVER_URL="http://127.0.0.1:19009/api/v1/push"
            export K6_PROMETHEUS_RW_HTTP_HEADERS="X-Scope-OrgID:pods"
            export K6_PROMETHEUS_RW_TREND_STATS="avg,med,p(90),p(95),p(99),max"
            export K6_PROMETHEUS_RW_PUSH_INTERVAL="5s"
            export K6_PROMETHEUS_RW_LABELS="test_type=${TEST_TYPE},test_run=${GITHUB_RUN_ID},environment=coquette"
            K6_ARGS=(-o experimental-prometheus-rw)
          fi

          if [ "$TEST_TYPE" = "individual-api-capacity" ]; then
            export MAX_VUS="$API_MAX_VUS"
            export VUS_STEP="$API_VUS_STEP"
            MAX_VUS="$API_MAX_VUS"
            VUS_STEP="$API_VUS_STEP"
            STAGE_DURATION="$API_STAGE_DURATION"
            export STAGE_DURATION="$API_STAGE_DURATION"
            RAW="k6-browser-results/k6-api-capacity-raw.json"
            LOG="k6-browser-results/k6-api-capacity-console.log"
            set +e
            k6 run \
              --out "json=${RAW}" \
              --tag testid="github-${GITHUB_RUN_ID}" \
              --tag application="toko-coquette" \
              --tag test_category="individual-api-capacity" \
              --summary-export k6-browser-results/api-capacity-summary.json \
              "$SCRIPT" 2>&1 | tee "$LOG"
            K6_EXIT_CODE=${PIPESTATUS[0]}
            set -e
            cp "$RAW" k6-browser-results/k6-raw.json
            python3 generate-k6-capacity-report.py \
              "$RAW" k6-browser-results/api-capacity-report.html \
              --max-p95-ms "$MAX_P95_MS" \
              --max-error-rate 1.0
            python3 convert-k6-capacity-to-jtl.py \
              "$RAW" k6-browser-results/api-capacity.jtl
          elif [ "$TEST_TYPE" = "capacity" ]; then
            VUS_STEP="$CAPACITY_VUS_STEP"
            export VUS_STEP
            RAW="k6-browser-results/k6-raw.json"
            LOG="k6-browser-results/k6-console.log"
            MEMORY="k6-browser-results/host-memory.csv"
            printf 'timestamp,mem_available_mb,action\n' > "$MEMORY"
            K6_PID=""
            MONITOR_PID=""
            RAM_ABORT=false
            RAM_OBSERVED=""

            cleanup_capacity() {
              if [ -n "${MONITOR_PID:-}" ]; then
                kill "$MONITOR_PID" 2>/dev/null || true
                wait "$MONITOR_PID" 2>/dev/null || true
              fi
              if [ -n "${K6_PID:-}" ] && kill -0 "$K6_PID" 2>/dev/null; then
                kill -INT -- "-$K6_PID" 2>/dev/null || kill -INT "$K6_PID" 2>/dev/null || true
                for _ in $(seq 1 15); do
                  kill -0 "$K6_PID" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$K6_PID" 2>/dev/null; then
                  kill -TERM -- "-$K6_PID" 2>/dev/null || kill -TERM "$K6_PID" 2>/dev/null || true
                fi
              fi
            }
            trap cleanup_capacity EXIT INT TERM

            setsid k6 run \
              --out "json=${RAW}" \
              "${K6_ARGS[@]}" \
              --tag testid="github-${GITHUB_RUN_ID}" \
              --tag application="toko-coquette" \
              --tag test_category="browser" \
              --summary-export k6-browser-results/capacity-summary.json \
              "$SCRIPT" > >(tee "$LOG") 2>&1 &
            K6_PID=$!
            echo "$K6_PID" > k6-browser-results/k6-process-group.pid

            (
              while kill -0 "$K6_PID" 2>/dev/null; do
                NOW="$(date --iso-8601=seconds)"
                AVAILABLE="$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)"
                echo "$NOW,$AVAILABLE,monitor" >> "$MEMORY"
                if (( AVAILABLE < MIN_AVAILABLE_RAM_MB )); then
                  echo "$AVAILABLE" > k6-browser-results/abort-ram-available-mb.txt
                  echo "$NOW" > k6-browser-results/abort-timestamp.txt
                  echo "::warning::Available RAM ${AVAILABLE} MB is below ${MIN_AVAILABLE_RAM_MB} MB; stopping capacity test."
                  kill -INT -- "-$K6_PID" 2>/dev/null || kill -INT "$K6_PID" 2>/dev/null || true
                  exit 0
                fi
                sleep 2
              done
            ) &
            MONITOR_PID=$!

            wait "$K6_PID"
            K6_EXIT_CODE=$?
            K6_PID=""
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
            MONITOR_PID=""
            if [ -f k6-browser-results/abort-ram-available-mb.txt ]; then
              RAM_ABORT=true
              RAM_OBSERVED="$(cat k6-browser-results/abort-ram-available-mb.txt)"
              # A RAM safety stop is a controlled capacity limit, not a K6 script failure.
              K6_EXIT_CODE=0
            fi
            printf '{\n  "ram_guard_triggered": %s,\n  "minimum_available_ram_mb": %s,\n  "observed_available_ram_mb": %s\n}\n' \
              "$RAM_ABORT" "$MIN_AVAILABLE_RAM_MB" "${RAM_OBSERVED:-null}" \
              > k6-browser-results/capacity-abort.json
          else
            # Existing functional/performance scenarios retain their original K6 invocation.
            set +e
            k6 run \
              --out json=k6-browser-results/k6-raw.json \
              "${K6_ARGS[@]}" \
              --tag testid="github-${GITHUB_RUN_ID}" \
              --tag application="toko-coquette" \
              --tag test_category="browser" \
              --summary-export k6-browser-results/capacity-summary.json \
              "$SCRIPT" 2>&1 | tee k6-browser-results/k6-console.log
            K6_EXIT_CODE=${PIPESTATUS[0]}
            set -e
          fi

          FINISHED_AT="$(date --iso-8601=seconds)"
          FINISHED_MS="$(date +%s%3N)"
          FIRST_FAILURE="$(grep -m1 'BROWSER_JOURNEY_FAILURE' k6-browser-results/k6-console.log | sed -E 's/.*timestamp_ms=([0-9]+).*/\1/' || true)"

          python3 - "$TEST_TYPE" "$TARGET_URL" "$STARTED_AT" "$STARTED_MS" "$FINISHED_AT" "$FINISHED_MS" "$MAX_VUS" "$VUS_STEP" "$STAGE_DURATION" "$FAILURE_RATE_LIMIT" "$K6_EXIT_CODE" "$GITHUB_RUN_NUMBER" <<'PY'
          import json,sys
          keys = ["test_type", "target_url", "started_at", "started_at_ms", "finished_at", "finished_at_ms", "max_vus", "vus_step", "stage_duration", "failure_rate_limit", "k6_exit_code", "run_number"]
          obj = dict(zip(keys, sys.argv[1:]))
          for k in ["started_at_ms", "finished_at_ms", "max_vus", "vus_step", "k6_exit_code", "run_number"]:
              obj[k] = int(obj[k])
          with open("k6-browser-results/run-metadata.json", "w") as f:
              json.dump(obj, f, indent=2)
          PY
          echo "$FIRST_FAILURE" > k6-browser-results/first-failure-timestamp-ms.txt
          echo "k6_exit_code=$K6_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "load_finished_ms=$FINISHED_MS" >> "$GITHUB_OUTPUT"
          echo "ram_abort=$RAM_ABORT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Measure homepage recovery after capacity test
        if: always() && inputs.test_type == 'capacity' && steps.k6.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail

          START_MS="${{ steps.k6.outputs.load_finished_ms }}"
          START_MS="${START_MS:-$(date +%s%3N)}"

          DEADLINE=$(( $(date +%s) + RECOVERY_TIMEOUT_MINUTES * 60 ))
          CONSECUTIVE=0
          RECOVERED=false
          RECOVERED_AT_MS=0

          echo "timestamp,http_status,result" > k6-browser-results/recovery-probes.csv

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            NOW="$(date +%s%3N)"
            CODE="$(curl -sS -L --max-time 10 -o /dev/null -w '%{http_code}' "$TARGET_URL" || true)"

            if [[ "$CODE" =~ ^2[0-9][0-9]$ ]]; then
              CONSECUTIVE=$((CONSECUTIVE + 1))
              echo "$NOW,$CODE,success" >> k6-browser-results/recovery-probes.csv

              if [ "$CONSECUTIVE" -ge 3 ]; then
                RECOVERED=true
                RECOVERED_AT_MS="$NOW"
                break
              fi
            else
              CONSECUTIVE=0
              echo "$NOW,$CODE,failure" >> k6-browser-results/recovery-probes.csv
            fi

            sleep 5
          done

          if [ "$RECOVERED" = true ]; then
            RECOVERY_DURATION_MS=$((RECOVERED_AT_MS - START_MS))
          else
            RECOVERY_DURATION_MS=""
          fi

          FIRST_FAILURE="$(cat k6-browser-results/first-failure-timestamp-ms.txt 2>/dev/null || true)"

          python3 - "$RECOVERED" "$START_MS" "$RECOVERED_AT_MS" "$RECOVERY_DURATION_MS" "$FIRST_FAILURE" <<'PY'
          import json,sys,datetime

          recovered,start,at,duration,first = sys.argv[1:]

          def iso(ms):
              return datetime.datetime.fromtimestamp(
                  int(ms)/1000,
                  datetime.timezone.utc
              ).isoformat() if ms and ms.isdigit() and int(ms)>0 else None

          obj = {
              "recovered": recovered == "true",
              "recovery_started_at_ms": int(start),
              "recovered_at_ms": int(at) if at else None,
              "recovery_duration_ms": int(duration) if duration else None,
              "recovery_started_at": iso(start),
              "recovered_at": iso(at),
              "first_failure_at_ms": int(first) if first.isdigit() else None,
              "first_failure_at": iso(first),
              "probe_interval_seconds": 5,
              "required_consecutive_successes": 3
          }

          with open("k6-browser-results/recovery.json", "w") as f:
              json.dump(obj, f, indent=2)
          PY

          if [ "$RECOVERED" != true ]; then
            echo "::warning::Homepage did not recover within ${RECOVERY_TIMEOUT_MINUTES} minutes."
          fi

      - name: Convert K6 raw JSON to JMeter JTL
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          RAW_FILE="k6-browser-results/k6-raw.json"
          JTL_FILE="k6-browser-results/k6-browser-results.jtl"

          if [ ! -s "$RAW_FILE" ]; then
            echo "::warning::K6 raw JSON not found or empty. JTL generation skipped."
            exit 0
          fi

          python3 convert_k6_json_to_jtl.py "$RAW_FILE" "$JTL_FILE"

      - name: Upload JTL and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toko-coquette-${{ inputs.test_type }}-performance-report-${{ github.run_number }}
          path: k6-browser-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Mimir port-forward
        if: always()
        shell: bash
        run: |
          if [ -f k6-browser-results/mimir-port-forward.pid ]; then
            kill "$(cat k6-browser-results/mimir-port-forward.pid)" 2>/dev/null || true
          fi

      - name: Mark workflow failed when K6 failed
        if: steps.k6.outputs.k6_exit_code != '0'
        shell: bash
        run: |
          echo "K6 failed. See uploaded artifact."
          exit 1
