
name: K6 Browser Testing

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: "Pilih skenario browser yang ingin dijalankan"
        required: true
        type: choice
        options:
          - capacity
          - homepage
          - product
          - login
          - cart
          - checkout
          - journey
        default: capacity

      target_url:
        description: "Base URL frontend Toko Coquette"
        required: true
        type: string
        default: "http://127.0.0.1:8080"

permissions:
  contents: read

concurrency:
  group: k6-browser-${{ inputs.test_type }}
  cancel-in-progress: false

jobs:
  browser-test:
    name: Run ${{ inputs.test_type }} browser test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90

    env:
      TARGET_URL: ${{ inputs.target_url }}
      TEST_TYPE: ${{ inputs.test_type }}
      MAX_VUS: "10"
      VUS_STEP: "2"
      STAGE_DURATION: "30s"
      FAILURE_RATE_LIMIT: "0.10"
      RECOVERY_TIMEOUT_MINUTES: "10"
      TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ==========================================
      # 3. K6 BROWSER
      # ==========================================
      - name: Setup k6 with browser support
        uses: grafana/setup-k6-action@v1
        with:
          browser: true

      # ==========================================
      # 4. VALIDATE RUNNER
      # ==========================================
      - name: Validate runner and application
        shell: bash
        run: |
          set -euo pipefail

          command -v k6
          command -v curl
          command -v node
          command -v python3
          command -v systemd-run

          k6 version

          test -f "k6-script-test/browser/config.js"
          test -f "k6-script-test/browser/journey.js"

          curl -fsS --max-time 15 "$TARGET_URL" -o /dev/null

          case "$TEST_TYPE" in
            capacity|login|cart|checkout|journey)
              if [ -z "$TEST_EMAIL" ] || [ -z "$TEST_PASSWORD" ]; then
                echo "::error::Missing K6_TEST_EMAIL or K6_TEST_PASSWORD."
                exit 1
              fi
              ;;
            homepage|product)
              ;;
            *)
              echo "::error::Unknown test type: $TEST_TYPE"
              exit 1
              ;;
          esac

      # ==========================================
      # 5. SELECT SCRIPT
      # ==========================================
      - name: Select script and prepare results
        id: select
        shell: bash
        run: |
          set -euo pipefail

          case "$TEST_TYPE" in
            capacity)
              SCRIPT="k6-script-test/browser/capacity-test.js"
              ;;
            homepage)
              SCRIPT="k6-script-test/browser/homepage-test.js"
              ;;
            product)
              SCRIPT="k6-script-test/browser/product-test.js"
              ;;
            login)
              SCRIPT="k6-script-test/browser/login-test.js"
              ;;
            cart)
              SCRIPT="k6-script-test/browser/cart-test.js"
              ;;
            checkout)
              SCRIPT="k6-script-test/browser/checkout-test.js"
              ;;
            journey)
              SCRIPT="k6-script-test/browser/journey-test.js"
              ;;
          esac

          test -f "$SCRIPT"

          mkdir -p k6-browser-results

          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

          echo "JTL_FILE=k6-browser-results/k6-${TEST_TYPE}-results-fixed.jtl" >> "$GITHUB_ENV"

          echo "SUMMARY_FILE=k6-browser-results/k6-${TEST_TYPE}-capacity-summary.json" >> "$GITHUB_ENV"

          echo "RECOVERY_FILE=k6-browser-results/k6-${TEST_TYPE}-recovery.json" >> "$GITHUB_ENV"

          echo "Selected script: $SCRIPT"

      # ==========================================
      # 6. START MIMIR PORT-FORWARD
      # ==========================================
      - name: Start Mimir port-forward when available
        id: mimir
        shell: bash
        run: |
          set -euo pipefail

          if command -v kubectl >/dev/null 2>&1 && \
             kubectl get svc mimir-monolithic -n monitoring >/dev/null 2>&1; then

            kubectl -n monitoring port-forward svc/mimir-monolithic 19009:9009 \
              > /tmp/k6-mimir-port-forward.log 2>&1 &

            echo $! > /tmp/k6-mimir-port-forward.pid

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:19009/ready >/dev/null 2>&1; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
                echo "Mimir is ready."
                exit 0
              fi
              sleep 2
            done

            echo "Mimir unavailable; continuing without remote write."
          else
            echo "Mimir unavailable; continuing without remote write."
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 7. RUN K6 WITH RESOURCE LIMITS
      # ==========================================
      - name: Run selected browser scenario
        id: k6
        shell: bash
        env:
          SCRIPT: ${{ steps.select.outputs.script }}
          MIMIR_ENABLED: ${{ steps.mimir.outputs.enabled }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -uo pipefail

          STARTED_AT="$(date --iso-8601=seconds)"
          STARTED_MS="$(date +%s%3N)"

          export K6_BROWSER_HEADLESS=true
          export BASE_URL="$TARGET_URL"

          export MAX_VUS
          export VUS_STEP
          export STAGE_DURATION
          export FAILURE_RATE_LIMIT
          export TEST_EMAIL
          export TEST_PASSWORD

          # ----------------------------------------
          # SYSTEMD USER MANAGER CONFIGURATION
          # ----------------------------------------

          echo "================================"
          echo "SYSTEMD ENVIRONMENT CHECK"
          echo "================================"

          RUNNER_UID="$(id -u)"
          RUNNER_USER="$(whoami)"

          export XDG_RUNTIME_DIR="/run/user/${RUNNER_UID}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"

          echo "Runner user: ${RUNNER_USER}"
          echo "Runner UID: ${RUNNER_UID}"
          echo "XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}"
          echo "DBUS_SESSION_BUS_ADDRESS: ${DBUS_SESSION_BUS_ADDRESS}"

          echo "Checking runtime directory..."
          if [ ! -d "$XDG_RUNTIME_DIR" ]; then
            echo "::error::Runtime directory does not exist: $XDG_RUNTIME_DIR"
            exit 1
          fi

          echo "Checking systemd user bus..."
          if [ ! -S "${XDG_RUNTIME_DIR}/bus" ]; then
            echo "::error::Systemd user bus socket is unavailable."
            echo "Check loginctl enable-linger and user@${RUNNER_UID}.service."
            exit 1
          fi

          echo "Checking systemd user manager..."
          if ! systemctl --user is-system-running; then
            echo "::error::Cannot connect to the systemd user manager."
            systemctl --user status || true
            exit 1
          fi

          echo "Systemd user manager is available."

          # ----------------------------------------
          # RESOURCE LIMIT CONFIGURATION
          # VM: 8 GB RAM / 4 vCPU
          # Reserve: 1 GB RAM
          # K6: maximum 7 GB RAM
          # K6: maximum 2 CPU
          # ----------------------------------------

          TOTAL_RAM_BYTES=$(awk '/MemTotal/ {print $2 * 1024}' /proc/meminfo)

          RESERVED_RAM_BYTES=$((1024 * 1024 * 1024))

          K6_MEMORY_MAX=$((TOTAL_RAM_BYTES - RESERVED_RAM_BYTES))

          K6_MEMORY_HIGH=$((K6_MEMORY_MAX * 90 / 100))

          CPU_QUOTA="200%"

          if [ "$K6_MEMORY_MAX" -le 0 ]; then
            echo "::error::Insufficient RAM."
            exit 1
          fi

          echo "================================"
          echo "K6 RESOURCE LIMIT"
          echo "================================"
          echo "Total RAM: $((TOTAL_RAM_BYTES / 1024 / 1024)) MB"
          echo "Reserved RAM: 1024 MB"
          echo "K6 Memory High: $((K6_MEMORY_HIGH / 1024 / 1024)) MB"
          echo "K6 Memory Max: $((K6_MEMORY_MAX / 1024 / 1024)) MB"
          echo "CPU Quota: $CPU_QUOTA"
          echo "================================"

          # ----------------------------------------
          # MIMIR CONFIGURATION
          # ----------------------------------------

          K6_ARGS=()

          if [ "$MIMIR_ENABLED" = "true" ]; then
            export K6_PROMETHEUS_RW_SERVER_URL="http://127.0.0.1:19009/api/v1/push"
            export K6_PROMETHEUS_RW_HTTP_HEADERS="X-Scope-OrgID:pods"
            export K6_PROMETHEUS_RW_TREND_STATS="avg,med,p(90),p(95),p(99),max"
            export K6_PROMETHEUS_RW_PUSH_INTERVAL="5s"
            export K6_PROMETHEUS_RW_LABELS="test_type=${TEST_TYPE},test_run=${GITHUB_RUN_ID},environment=coquette"

            K6_ARGS=(-o experimental-prometheus-rw)
          fi

          # ----------------------------------------
          # START HOST + KUBERNETES RESOURCE SAMPLER
          # ----------------------------------------

          mkdir -p k6-browser-results
          python3 resource-monitor.py \
            --output k6-browser-results/resource-monitor.csv \
            --interval 2 &
          RESOURCE_MONITOR_PID=$!
          echo "Resource monitor PID: ${RESOURCE_MONITOR_PID}"

          # ----------------------------------------
          # RUN K6 INSIDE SYSTEMD RESOURCE SCOPE
          # ----------------------------------------

          echo "Starting K6 inside resource-limited systemd scope."

          set +e

          systemd-run \
            --user \
            --scope \
            --property="MemoryHigh=${K6_MEMORY_HIGH}" \
            --property="MemoryMax=${K6_MEMORY_MAX}" \
            --property="CPUQuota=${CPU_QUOTA}" \
            -- \
            k6 run \
              --out json=/tmp/k6-browser-raw.json \
              "${K6_ARGS[@]}" \
              --tag testid="github-${GITHUB_RUN_ID}" \
              --tag application="toko-coquette" \
              --tag test_category="browser" \
              --summary-export "$SUMMARY_FILE" \
              "$SCRIPT"

          K6_EXIT_CODE=$?

          set -e

          # Stop sampler cleanly after K6 has completed.
          kill -TERM "$RESOURCE_MONITOR_PID" 2>/dev/null || true
          wait "$RESOURCE_MONITOR_PID" 2>/dev/null || true

          FINISHED_AT="$(date --iso-8601=seconds)"
          FINISHED_MS="$(date +%s%3N)"

          echo "K6 exit code: $K6_EXIT_CODE"

          echo "k6_exit_code=$K6_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "load_finished_ms=$FINISHED_MS" >> "$GITHUB_OUTPUT"

          python3 - "$TEST_TYPE" "$TARGET_URL" "$STARTED_AT" "$STARTED_MS" "$FINISHED_AT" "$FINISHED_MS" "$MAX_VUS" "$VUS_STEP" "$STAGE_DURATION" "$FAILURE_RATE_LIMIT" "$K6_EXIT_CODE" "$GITHUB_RUN_NUMBER" <<'PY'
          import json
          import sys

          keys = [
              "test_type",
              "target_url",
              "started_at",
              "started_at_ms",
              "finished_at",
              "finished_at_ms",
              "max_vus",
              "vus_step",
              "stage_duration",
              "failure_rate_limit",
              "k6_exit_code",
              "run_number"
          ]

          data = dict(zip(keys, sys.argv[1:]))

          for key in [
              "started_at_ms",
              "finished_at_ms",
              "max_vus",
              "vus_step",
              "k6_exit_code",
              "run_number"
          ]:
              data[key] = int(str(data[key]).strip().strip('"').strip("'"))

          with open("/tmp/k6-run-metadata.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

          exit 0

      # ==========================================
      # 8. CAPACITY RECOVERY CHECK
      # ==========================================
      - name: Measure homepage recovery after capacity test
        if: always() && inputs.test_type == 'capacity' && steps.k6.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail

          START_MS="${{ steps.k6.outputs.load_finished_ms }}"
          START_MS="${START_MS:-$(date +%s%3N)}"

          DEADLINE=$(( $(date +%s) + RECOVERY_TIMEOUT_MINUTES * 60 ))

          CONSECUTIVE=0
          RECOVERED=false
          RECOVERED_AT_MS=0

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            NOW="$(date +%s%3N)"

            CODE="$(curl -sS -L --max-time 10 \
              -o /dev/null -w '%{http_code}' "$TARGET_URL" || true)"

            if [[ "$CODE" =~ ^2[0-9][0-9]$ ]]; then
              CONSECUTIVE=$((CONSECUTIVE + 1))
              echo "Recovery probe: HTTP $CODE ($CONSECUTIVE/3)"

              if [ "$CONSECUTIVE" -ge 3 ]; then
                RECOVERED=true
                RECOVERED_AT_MS="$NOW"
                break
              fi
            else
              CONSECUTIVE=0
              echo "Recovery probe failed: HTTP $CODE"
            fi

            sleep 5
          done

          if [ "$RECOVERED" = true ]; then
            RECOVERY_DURATION_MS=$((RECOVERED_AT_MS - START_MS))
          else
            RECOVERY_DURATION_MS=""
          fi

          python3 - "$RECOVERED" "$START_MS" "$RECOVERED_AT_MS" "$RECOVERY_DURATION_MS" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          recovered, start, end, duration = sys.argv[1:]

          def to_iso(value):
              if not value or value == "0":
                  return None
              return datetime.fromtimestamp(
                  int(value) / 1000,
                  timezone.utc
              ).isoformat()

          data = {
              "recovered": recovered == "true",
              "recovery_started_at_ms": int(start),
              "recovered_at_ms": int(end) if end else None,
              "recovery_duration_ms": int(duration) if duration else None,
              "recovery_started_at": to_iso(start),
              "recovered_at": to_iso(end),
              "probe_interval_seconds": 5,
              "required_consecutive_successes": 3
          }

          with open("k6-browser-results/k6-capacity-recovery.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

          if [ "$RECOVERED" != true ]; then
            echo "::warning::Homepage did not recover within ${RECOVERY_TIMEOUT_MINUTES} minutes."
          fi

      # ==========================================
      # 9. COPY RAW JSON AND CONVERT TO JMETER JTL
      # ==========================================
      - name: Convert K6 Browser results to JMeter JTL
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          RAW_FILE="/tmp/k6-browser-raw.json"
          RAW_COPY="k6-browser-results/k6-${TEST_TYPE}-raw.json"

          if [ ! -s "$RAW_FILE" ]; then
            echo "::error::K6 raw JSON is missing or empty."
            exit 1
          fi

          cp "$RAW_FILE" "$RAW_COPY"

          node <<'NODE'
          const fs = require('fs');

          const input = '/tmp/k6-browser-raw.json';
          const output = process.env.JTL_FILE;

          const headers = [
            'timeStamp',
            'elapsed',
            'label',
            'responseCode',
            'responseMessage',
            'threadName',
            'dataType',
            'success',
            'failureMessage',
            'bytes',
            'sentBytes',
            'grpThreads',
            'allThreads',
            'URL',
            'Latency',
            'IdleTime',
            'Connect'
          ];

          function csvValue(value) {
            if (value === null || value === undefined) return '';

            const text = String(value);

            if (/[",\r\n]/.test(text)) {
              return '"' + text.replace(/"/g, '""') + '"';
            }

            return text;
          }

          const lines = fs.readFileSync(input, 'utf8')
            .split(/\r?\n/)
            .filter(Boolean);

          const rows = [headers.join(',')];

          let exported = 0;

          for (const line of lines) {
            let event;

            try {
              event = JSON.parse(line);
            } catch {
              continue;
            }

            if (
              event.type !== 'Point' ||
              event.metric !== 'iteration_duration' ||
              !event.data
            ) {
              continue;
            }

            const timestamp = Date.parse(event.data.time);
            const elapsed = Math.round(Number(event.data.value));

            if (
              !Number.isFinite(timestamp) ||
              !Number.isFinite(elapsed) ||
              elapsed < 0
            ) {
              continue;
            }

            const tags = event.data.tags || {};

            const row = [
              timestamp,
              elapsed,
              'K6 Browser - Product Iteration',
              '0',
              'Iteration duration; HTTP status not measured',
              tags.scenario || 'product_browser',
              'text',
              'true',
              '',
              0,
              0,
              0,
              0,
              '',
              0,
              0,
              0
            ];

            rows.push(row.map(csvValue).join(','));
            exported++;
          }

          fs.writeFileSync(output, rows.join('\n') + '\n');

          console.log(`Exported iterations: ${exported}`);

          if (exported === 0) {
            console.error('No iteration_duration samples found.');
            process.exitCode = 1;
          }
          NODE

          ls -lh "$RAW_COPY" "$JTL_FILE"
          wc -l "$JTL_FILE"

      # ==========================================
      # 10. GENERATE FULL HTML DASHBOARD
      # ==========================================
      - name: Generate browser performance dashboard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p k6-browser-results
          if [ -f /tmp/k6-run-metadata.json ]; then
            cp /tmp/k6-run-metadata.json k6-browser-results/run-metadata.json
          fi
          if [ -f "$RECOVERY_FILE" ]; then
            cp "$RECOVERY_FILE" k6-browser-results/recovery.json
          elif [ -f k6-browser-results/k6-capacity-recovery.json ]; then
            cp k6-browser-results/k6-capacity-recovery.json k6-browser-results/recovery.json
          fi
          node generate-browser-report.js k6-browser-results
          test -s k6-browser-results/browser-report.html

      # ==========================================
      # 11. UPLOAD RESULTS
      # ==========================================
      - name: Upload K6 Results, Resource Metrics and HTML Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toko-coquette-${{ inputs.test_type }}-results-${{ github.run_number }}
          path: |
            k6-browser-results/*-results-fixed.jtl
            k6-browser-results/*-capacity-summary.json
            k6-browser-results/*-recovery.json
            k6-browser-results/*-raw.json
            k6-browser-results/resource-monitor.csv
            k6-browser-results/run-metadata.json
            k6-browser-results/recovery.json
            k6-browser-results/browser-report.html
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # 12. STOP MIMIR PORT-FORWARD
      # ==========================================
      - name: Stop Mimir port-forward
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/k6-mimir-port-forward.pid ]; then
            kill "$(cat /tmp/k6-mimir-port-forward.pid)" 2>/dev/null || true
          fi

      # ==========================================
      # 13. MARK WORKFLOW FAILED IF K6 FAILED
      # ==========================================
      - name: Mark workflow failed when K6 failed
        if: steps.k6.outputs.k6_exit_code != '0'
        shell: bash
        run: |
          echo "K6 failed. Check the generated JTL and summary artifact."
          exit 1
