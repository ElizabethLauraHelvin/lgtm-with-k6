name: K6 Browser Testing

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: "Pilih skenario browser yang ingin dijalankan"
        required: true
        type: choice
        options:
          - capacity
          - homepage
          - product
          - login
          - cart
          - checkout
          - journey
        default: capacity

      target_url:
        description: "Base URL frontend Toko Coquette"
        required: true
        type: string
        default: "http://127.0.0.1:8080"

permissions:
  contents: read

concurrency:
  group: k6-browser-${{ inputs.test_type }}
  cancel-in-progress: false

jobs:
  browser-test:
    name: Run ${{ inputs.test_type }} browser test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90

    env:
      TARGET_URL: ${{ inputs.target_url }}
      TEST_TYPE: ${{ inputs.test_type }}
      MAX_VUS: "50"
      VUS_STEP: "2"
      STAGE_DURATION: "30s"
      FAILURE_RATE_LIMIT: "0.10"
      RECOVERY_TIMEOUT_MINUTES: "10"
      TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}

    steps:
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ==========================================
      # 3. SETUP K6 BROWSER
      # ==========================================
      - name: Setup k6 with browser support
        uses: grafana/setup-k6-action@v1
        with:
          browser: true

      # ==========================================
      # 4. VALIDATE RUNNER AND APPLICATION
      # ==========================================
      - name: Validate runner and application
        shell: bash
        run: |
          set -euo pipefail

          command -v k6
          command -v curl
          command -v node

          k6 version

          test -f "k6-script-test/browser/config.js"
          test -f "k6-script-test/browser/journey.js"

          curl -fsS --max-time 15 "$TARGET_URL" -o /dev/null

          case "$TEST_TYPE" in
            capacity|login|cart|checkout|journey)
              if [ -z "$TEST_EMAIL" ] || [ -z "$TEST_PASSWORD" ]; then
                echo "::error::Skenario $TEST_TYPE memerlukan repository secrets K6_TEST_EMAIL dan K6_TEST_PASSWORD."
                exit 1
              fi
              ;;
            homepage|product)
              ;;
            *)
              echo "::error::Skenario tidak dikenal: $TEST_TYPE"
              exit 1
              ;;
          esac

      # ==========================================
      # 5. SELECT TEST SCRIPT AND OUTPUT FILES
      # ==========================================
      - name: Select script and prepare results
        id: select
        shell: bash
        run: |
          set -euo pipefail

          case "$TEST_TYPE" in
            capacity)
              SCRIPT="k6-script-test/browser/capacity-test.js"
              ;;
            homepage)
              SCRIPT="k6-script-test/browser/homepage-test.js"
              ;;
            product)
              SCRIPT="k6-script-test/browser/product-test.js"
              ;;
            login)
              SCRIPT="k6-script-test/browser/login-test.js"
              ;;
            cart)
              SCRIPT="k6-script-test/browser/cart-test.js"
              ;;
            checkout)
              SCRIPT="k6-script-test/browser/checkout-test.js"
              ;;
            journey)
              SCRIPT="k6-script-test/browser/journey-test.js"
              ;;
          esac

          test -f "$SCRIPT"

          mkdir -p k6-browser-results

          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

          echo "JTL_FILE=k6-browser-results/k6-${TEST_TYPE}-results.jtl" >> "$GITHUB_ENV"

          echo "SUMMARY_FILE=k6-browser-results/k6-${TEST_TYPE}-capacity-summary.json" >> "$GITHUB_ENV"

          echo "Selected script: $SCRIPT"
          echo "JTL output: k6-browser-results/k6-${TEST_TYPE}-results.jtl"
          echo "Summary output: k6-browser-results/k6-${TEST_TYPE}-capacity-summary.json"

      # ==========================================
      # 6. START MIMIR PORT-FORWARD
      # ==========================================
      - name: Start Mimir port-forward when available
        id: mimir
        shell: bash
        run: |
          set -euo pipefail

          if command -v kubectl >/dev/null 2>&1 && \
             kubectl get svc mimir-monolithic -n monitoring >/dev/null 2>&1; then

            kubectl -n monitoring port-forward svc/mimir-monolithic 19009:9009 \
              > /tmp/k6-mimir-port-forward.log 2>&1 &

            echo $! > /tmp/k6-mimir-port-forward.pid

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:19009/ready >/dev/null 2>&1; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
                echo "Mimir is ready."
                exit 0
              fi

              sleep 2
            done

            echo "Mimir not ready; continuing without remote write."
          else
            echo "kubectl/Mimir unavailable; continuing without remote write."
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 7. RUN SELECTED K6 BROWSER SCENARIO
      # ==========================================
      - name: Run selected browser scenario
        id: k6
        shell: bash
        env:
          SCRIPT: ${{ steps.select.outputs.script }}
          MIMIR_ENABLED: ${{ steps.mimir.outputs.enabled }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -uo pipefail

          STARTED_AT="$(date --iso-8601=seconds)"
          STARTED_MS="$(date +%s%3N)"

          export K6_BROWSER_HEADLESS=true
          export BASE_URL="$TARGET_URL"

          export MAX_VUS
          export VUS_STEP
          export STAGE_DURATION
          export FAILURE_RATE_LIMIT
          export TEST_EMAIL
          export TEST_PASSWORD

          K6_ARGS=()

          if [ "$MIMIR_ENABLED" = "true" ]; then
            export K6_PROMETHEUS_RW_SERVER_URL="http://127.0.0.1:19009/api/v1/push"
            export K6_PROMETHEUS_RW_HTTP_HEADERS="X-Scope-OrgID:pods"
            export K6_PROMETHEUS_RW_TREND_STATS="avg,med,p(90),p(95),p(99),max"
            export K6_PROMETHEUS_RW_PUSH_INTERVAL="5s"
            export K6_PROMETHEUS_RW_LABELS="test_type=${TEST_TYPE},test_run=${GITHUB_RUN_ID},environment=coquette"

            K6_ARGS=(-o experimental-prometheus-rw)
          fi

          echo "Starting K6 browser scenario: $TEST_TYPE"

          set +e

          k6 run \
            --out json=/tmp/k6-browser-raw.json \
            "${K6_ARGS[@]}" \
            --tag testid="github-${GITHUB_RUN_ID}" \
            --tag application="toko-coquette" \
            --tag test_category="browser" \
            --summary-export "$SUMMARY_FILE" \
            "$SCRIPT"

          K6_EXIT_CODE=$?

          set -e

          FINISHED_AT="$(date --iso-8601=seconds)"
          FINISHED_MS="$(date +%s%3N)"

          echo "K6 finished with exit code: $K6_EXIT_CODE"

          echo "k6_exit_code=$K6_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "load_finished_ms=$FINISHED_MS" >> "$GITHUB_OUTPUT"

          python3 - "$TEST_TYPE" "$TARGET_URL" "$STARTED_AT" "$STARTED_MS" "$FINISHED_AT" "$FINISHED_MS" "$MAX_VUS" "$VUS_STEP" "$STAGE_DURATION" "$FAILURE_RATE_LIMIT" "$K6_EXIT_CODE" "$GITHUB_RUN_NUMBER" <<'PY'
          import json
          import sys

          keys = [
              "test_type",
              "target_url",
              "started_at",
              "started_at_ms",
              "finished_at",
              "finished_at_ms",
              "max_vus",
              "vus_step",
              "stage_duration",
              "failure_rate_limit",
              "k6_exit_code",
              "run_number"
          ]

          values = sys.argv[1:]
          data = dict(zip(keys, values))

          for key in [
              "started_at_ms",
              "finished_at_ms",
              "max_vus",
              "vus_step",
              "k6_exit_code",
              "run_number"
          ]:
              data[key] = int(data[key])

          with open("/tmp/k6-run-metadata.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

          exit 0

      # ==========================================
      # 8. MEASURE HOMEPAGE RECOVERY
      # ONLY FOR CAPACITY TEST
      # ==========================================
      - name: Measure homepage recovery after capacity test
        if: always() && inputs.test_type == 'capacity' && steps.k6.outcome != 'skipped'
        shell: bash
        run: |
          set -uo pipefail

          START_MS="${{ steps.k6.outputs.load_finished_ms }}"
          START_MS="${START_MS:-$(date +%s%3N)}"

          DEADLINE=$(( $(date +%s) + RECOVERY_TIMEOUT_MINUTES * 60 ))

          CONSECUTIVE=0
          RECOVERED=false
          RECOVERED_AT_MS=0

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do

            NOW="$(date +%s%3N)"

            CODE="$(curl -sS -L --max-time 10 \
              -o /dev/null -w '%{http_code}' "$TARGET_URL" || true)"

            if [[ "$CODE" =~ ^2[0-9][0-9]$ ]]; then

              CONSECUTIVE=$((CONSECUTIVE + 1))

              echo "Recovery probe: HTTP $CODE ($CONSECUTIVE/3)"

              if [ "$CONSECUTIVE" -ge 3 ]; then
                RECOVERED=true
                RECOVERED_AT_MS="$NOW"
                break
              fi

            else
              CONSECUTIVE=0
              echo "Recovery probe failed: HTTP $CODE"
            fi

            sleep 5
          done

          if [ "$RECOVERED" = true ]; then
            RECOVERY_DURATION_MS=$((RECOVERED_AT_MS - START_MS))
            echo "Homepage recovered."
            echo "Recovery duration: ${RECOVERY_DURATION_MS} ms"
          else
            echo "::warning::Homepage did not recover within ${RECOVERY_TIMEOUT_MINUTES} minutes."
          fi

      # ==========================================
      # 9. CONVERT K6 JSON TO JMETER JTL
      # ==========================================
      - name: Convert K6 results to JMeter JTL
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          RAW_FILE="/tmp/k6-browser-raw.json"

          if [ ! -f "$RAW_FILE" ]; then
            echo "::error::K6 raw JSON was not generated."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');

          const input = '/tmp/k6-browser-raw.json';
          const output = process.env.JTL_FILE;

          const headers = [
            'timeStamp',
            'elapsed',
            'label',
            'responseCode',
            'responseMessage',
            'threadName',
            'dataType',
            'success',
            'failureMessage',
            'bytes',
            'sentBytes',
            'grpThreads',
            'allThreads',
            'URL',
            'Latency',
            'IdleTime',
            'Connect'
          ];

          function escapeCSV(value) {
            if (value === null || value === undefined) {
              return '';
            }

            return '"' + String(value).replace(/"/g, '""') + '"';
          }

          const lines = fs.readFileSync(input, 'utf8')
            .split(/\r?\n/)
            .filter(Boolean);

          const rows = [headers.join(',')];

          let exported = 0;

          for (const line of lines) {
            let event;

            try {
              event = JSON.parse(line);
            } catch {
              continue;
            }

            if (
              event.type !== 'Point' ||
              !event.data ||
              !event.metric
            ) {
              continue;
            }

            if (
              event.metric !== 'browser_http_req_duration' &&
              event.metric !== 'http_req_duration'
            ) {
              continue;
            }

            const data = event.data;
            const tags = data.tags || {};

            const timestamp = data.time
              ? new Date(data.time).getTime()
              : '';

            const elapsed = Math.round(Number(data.value || 0));

            const status = tags.status || '';
            const url = tags.url || '';

            const label =
              tags.name ||
              url ||
              event.metric;

            let success = '';
            let failureMessage = '';

            if (status !== '') {
              const code = Number(status);

              success = code >= 200 && code < 400;

              if (!success) {
                failureMessage = `HTTP ${code}`;
              }
            }

            const row = [
              timestamp,
              elapsed,
              label,
              status,
              '',
              'K6 Browser (source)',
              'text',
              success,
              failureMessage,
              '',
              '',
              '',
              '',
              url,
              '',
              '',
              ''
            ];

            rows.push(row.map(escapeCSV).join(','));

            exported++;
          }

          fs.writeFileSync(
            output,
            rows.join('\n') + '\n'
          );

          console.log(`JTL generated: ${output}`);
          console.log(`Total HTTP samples: ${exported}`);

          if (exported === 0) {
            console.error(
              'No HTTP duration samples were found in K6 output.'
            );

            process.exitCode = 1;
          }
          NODE

      # ==========================================
      # 10. UPLOAD JTL AND CAPACITY SUMMARY
      # ==========================================
      - name: Upload K6 JTL and Capacity Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toko-coquette-${{ inputs.test_type }}-results-${{ github.run_number }}
          path: |
            k6-browser-results/*.jtl
            k6-browser-results/*.json
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # 11. STOP MIMIR PORT-FORWARD
      # ==========================================
      - name: Stop Mimir port-forward
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/k6-mimir-port-forward.pid ]; then
            kill "$(cat /tmp/k6-mimir-port-forward.pid)" 2>/dev/null || true
          fi

      # ==========================================
      # 12. MARK WORKFLOW FAILED IF K6 FAILED
      # ==========================================
      - name: Mark workflow failed when K6 failed
        if: always() && steps.k6.outputs.k6_exit_code != '0'
        shell: bash
        run: |
          echo "K6 failed. Check the generated JTL and summary artifact."
          exit 1
