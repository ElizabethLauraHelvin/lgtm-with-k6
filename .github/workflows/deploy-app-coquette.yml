
name: Deploy App Coquette

on:
  push:
    branches:
      - main
    paths:
      - 'toko-coquette/backend/**'
      - 'toko-coquette/frontend/**'
      - 'toko-coquette/infrastructure/nginx/**'
      - 'toko-coquette/k3d/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toko-coquette-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64, k3d-vm]

    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      VERSION: v1.0.${{ github.run_number }}

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Check Kubernetes connection
      - name: Check Kubernetes Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # 3. Detect initial deployment and changed folders
      - name: Detect Deployment Mode
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          BACKEND_EXISTS=$(kubectl get deployment backend \
            -n ecommerce --ignore-not-found -o name 2>/dev/null || true)

          FRONTEND_EXISTS=$(kubectl get deployment frontend \
            -n ecommerce --ignore-not-found -o name 2>/dev/null || true)

          INITIAL=false
          BACKEND=false
          FRONTEND=false

          # First deployment: build both applications
          if [[ -z "$BACKEND_EXISTS" || -z "$FRONTEND_EXISTS" ]]; then
            INITIAL=true
            BACKEND=true
            FRONTEND=true

          # Manual run: deploy both applications
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BACKEND=true
            FRONTEND=true

          # Automatic push: detect changed folders
          else
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              BACKEND=true
              FRONTEND=true
            else
              CHANGED_FILES=$(git diff --name-only "$BEFORE" "$CURRENT_SHA")

              echo "$CHANGED_FILES"

              if echo "$CHANGED_FILES" | grep -q '^toko-coquette/backend/'; then
                BACKEND=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^toko-coquette/frontend/'; then
                FRONTEND=true
              fi
            fi
          fi

          echo "initial=$INITIAL" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"

          echo "Initial deployment: $INITIAL"
          echo "Build backend: $BACKEND"
          echo "Build frontend: $FRONTEND"

      # 4. Login Docker Hub
      - name: Login Docker Hub
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKER_USER" || {
            echo "DOCKERHUB_USERNAME is missing"
            exit 1
          }

          echo "$DOCKERHUB_TOKEN" | \
            docker login -u "$DOCKER_USER" --password-stdin

      # 5. Build Backend
      - name: Build Backend Image
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker build \
            -t "$DOCKER_USER/toko-coquette-backend:$VERSION" \
            -t "$DOCKER_USER/toko-coquette-backend:latest" \
            ./toko-coquette/backend

      # 6. Push Backend
      - name: Push Backend Image
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker push "$DOCKER_USER/toko-coquette-backend:$VERSION"
          docker push "$DOCKER_USER/toko-coquette-backend:latest"

      # 7. Build Frontend
      - name: Build Frontend Image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          docker build \
            -t "$DOCKER_USER/toko-coquette-frontend:$VERSION" \
            -t "$DOCKER_USER/toko-coquette-frontend:latest" \
            ./toko-coquette/frontend

      # 8. Push Frontend
      - name: Push Frontend Image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          docker push "$DOCKER_USER/toko-coquette-frontend:$VERSION"
          docker push "$DOCKER_USER/toko-coquette-frontend:latest"

      # 9. Initial deployment
      - name: Initial Deployment to k3d
        if: steps.changes.outputs.initial == 'true'
        run: |
          kubectl create namespace ecommerce \
            --dry-run=client -o yaml | kubectl apply -f -

          sed \
            -e "s|elilaura/toko-coquette-backend:latest|$DOCKER_USER/toko-coquette-backend:$VERSION|g" \
            -e "s|elilaura/toko-coquette-frontend:latest|$DOCKER_USER/toko-coquette-frontend:$VERSION|g" \
            toko-coquette/k3d/app.yaml > /tmp/coquette-app.yaml

          kubectl apply -f /tmp/coquette-app.yaml

          kubectl rollout status deployment/backend \
            -n ecommerce --timeout=180s

          kubectl rollout status deployment/frontend \
            -n ecommerce --timeout=180s

      # 10. Update Backend only
      - name: Deploy Backend Update
        if: steps.changes.outputs.backend == 'true' && steps.changes.outputs.initial != 'true'
        run: |
          kubectl set image deployment/backend \
            backend="$DOCKER_USER/toko-coquette-backend:$VERSION" \
            -n ecommerce

          kubectl rollout status deployment/backend \
            -n ecommerce --timeout=180s

      # 11. Update Frontend only
      - name: Deploy Frontend Update
        if: steps.changes.outputs.frontend == 'true' && steps.changes.outputs.initial != 'true'
        run: |
          kubectl set image deployment/frontend \
            frontend="$DOCKER_USER/toko-coquette-frontend:$VERSION" \
            -n ecommerce

          kubectl rollout status deployment/frontend \
            -n ecommerce --timeout=180s

      # 12. Verify deployment
      - name: Verify Deployment
        run: |
          echo "===== PODS ====="
          kubectl get pods -n ecommerce

          echo "===== DEPLOYMENTS ====="
          kubectl get deployments -n ecommerce

          echo "===== SERVICES ====="
          kubectl get services -n ecommerce

          echo "===== IMAGES ====="
          kubectl get deployments -n ecommerce \
            -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.template.spec.containers[0].image}{"\n"}{end}'
      
      # 13. Configure Host Nginx Reverse Proxy
      - name: Configure Host Nginx
        run: |
          echo "===== INSTALL NGINX IF NEEDED ====="

          if ! command -v nginx >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install -y nginx
          fi

          echo "===== CONFIGURE REVERSE PROXY ====="

          sudo -n install -D \
            -m 644 \
            toko-coquette/infrastructure/nginx/toko-coquette.conf \
            /etc/nginx/sites-available/toko-coquette

          sudo -n ln -sfn \
            /etc/nginx/sites-available/toko-coquette \
            /etc/nginx/sites-enabled/toko-coquette

          echo "===== TEST NGINX CONFIGURATION ====="

          sudo -n nginx -t

          echo "===== START OR RELOAD NGINX ====="

          sudo -n systemctl enable nginx

          if sudo -n systemctl is-active --quiet nginx; then
            sudo -n systemctl reload nginx
          else
            sudo -n systemctl start nginx
          fi

          echo "===== VERIFY NGINX ====="

          sudo -n systemctl status nginx --no-pager
          curl -I http://127.0.0.1


      # 14. Logout Docker Hub
      - name: Logout Docker Hub
        if: always()
        run: docker logout || true
